<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rui Cheng">
  <defs>
    <linearGradient id="fvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d3450"/>
      <stop offset="52%" stop-color="#062033"/>
      <stop offset="100%" stop-color="#04101f"/>
    </linearGradient>
    <linearGradient id="fvEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ce3ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- 左上角柔光，呼应首页封面的辉光 -->
    <radialGradient id="fvGlow" cx="0.26" cy="0.2" r="0.72">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底：圆角方块 + 深空渐变 -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#fvBg)"/>
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#fvGlow)"/>
  <!-- 青色发丝描边 -->
  <rect x="0.8" y="0.8" width="62.4" height="62.4" rx="14.2" fill="none"
        stroke="url(#fvEdge)" stroke-opacity="0.5" stroke-width="1.6"/>

  <!-- 字母 RC：加粗、居中、放大，保证 16px 下仍可辨认 -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif"
        font-size="30" font-weight="700" fill="#eaf6ff" letter-spacing="0.2">RC</text>
</svg>
