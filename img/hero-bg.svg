<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <title>Tech Hero Background</title>
  <defs>
    <!-- 底色：深海军蓝 -> 深宝蓝，对角渐变 -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04101f"/>
      <stop offset="38%" stop-color="#082139"/>
      <stop offset="72%" stop-color="#0b2c4d"/>
      <stop offset="100%" stop-color="#123f6b"/>
    </linearGradient>

    <!-- 角部提亮，避免整体死板 -->
    <radialGradient id="cornerTL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0e7fa8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0e7fa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerBR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>

    <!-- 发光球 -->
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.36"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- 网格：64px 方格 -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7dd3fc" stroke-width="1" stroke-opacity="0.13"/>
    </pattern>
    <!-- 细网格：16px -->
    <pattern id="gridFine" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#7dd3fc" stroke-width="0.6" stroke-opacity="0.05"/>
    </pattern>

    <!-- 扫描线 -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#a5f3fc" fill-opacity="0.045"/>
    </pattern>

    <!-- 网格遮罩：中心淡、四周浓，给标题让出干净区域 -->
    <radialGradient id="gridFadeC" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1600" height="900" fill="url(#gridFadeC)"/>
    </mask>

    <!-- 暗角：聚焦中心 -->
    <radialGradient id="vignette" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="58%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>

    <!-- 斜向光束 -->
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <!-- 底部渐隐，衔接下方正文 -->
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04101f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04101f" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- ===== 1. 底色 ===== -->
  <rect width="1600" height="900" fill="url(#base)"/>
  <ellipse cx="150" cy="90" rx="760" ry="560" fill="url(#cornerTL)"/>
  <ellipse cx="1490" cy="830" rx="720" ry="520" fill="url(#cornerBR)"/>

  <!-- ===== 2. 网格层（被遮罩压暗中心） ===== -->
  <g mask="url(#gridMask)">
    <rect width="1600" height="900" fill="url(#gridFine)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
  </g>
  <rect width="1600" height="900" fill="url(#scan)"/>

  <!-- ===== 3. 光束 ===== -->
  <g transform="rotate(-24 800 450)">
    <rect x="-260" y="140" width="1300" height="72" fill="url(#streak)"/>
    <rect x="180" y="360" width="1100" height="34" fill="url(#streak)"/>
  </g>
  <g transform="rotate(18 800 450)">
    <rect x="420" y="700" width="1150" height="56" fill="url(#streak2)"/>
  </g>

  <!-- ===== 4. 发光球（避开中央文字带 y≈310~560） ===== -->
  <circle cx="215" cy="150" r="330" fill="url(#glowCyan)"/>
  <circle cx="1415" cy="205" r="285" fill="url(#glowBlue)"/>
  <circle cx="1320" cy="800" r="340" fill="url(#glowViolet)"/>
  <circle cx="255" cy="810" r="250" fill="url(#glowCyan)"/>

  <!-- ===== 5. 网络节点与连线（分布在四周，不侵入中心） ===== -->
  <g stroke="#7dd3fc" stroke-width="1.1" fill="none">
    <path d="M120 300 L268 214 L392 268 L520 176" stroke-opacity="0.3"/>
    <path d="M268 214 L300 96 L432 62" stroke-opacity="0.2"/>
    <path d="M1240 640 L1372 588 L1478 662 L1560 596" stroke-opacity="0.3"/>
    <path d="M1372 588 L1420 728 L1546 764" stroke-opacity="0.2"/>
    <path d="M96 620 L206 690 L168 820" stroke-opacity="0.22"/>
    <path d="M1400 118 L1502 158 L1560 252" stroke-opacity="0.22"/>
  </g>
  <g fill="#a5f3fc">
    <circle cx="120" cy="300" r="3.4" fill-opacity="0.75"/>
    <circle cx="268" cy="214" r="4.6" fill-opacity="0.9"/>
    <circle cx="392" cy="268" r="3" fill-opacity="0.6"/>
    <circle cx="520" cy="176" r="3.8" fill-opacity="0.7"/>
    <circle cx="300" cy="96" r="2.8" fill-opacity="0.55"/>
    <circle cx="432" cy="62" r="3.2" fill-opacity="0.6"/>
    <circle cx="1240" cy="640" r="3.2" fill-opacity="0.65"/>
    <circle cx="1372" cy="588" r="4.6" fill-opacity="0.9"/>
    <circle cx="1478" cy="662" r="3" fill-opacity="0.6"/>
    <circle cx="1560" cy="596" r="3.6" fill-opacity="0.7"/>
    <circle cx="1420" cy="728" r="3" fill-opacity="0.55"/>
    <circle cx="1546" cy="764" r="3.4" fill-opacity="0.6"/>
    <circle cx="96" cy="620" r="3.2" fill-opacity="0.6"/>
    <circle cx="206" cy="690" r="4.2" fill-opacity="0.8"/>
    <circle cx="168" cy="820" r="3" fill-opacity="0.55"/>
    <circle cx="1400" cy="118" r="3.4" fill-opacity="0.7"/>
    <circle cx="1502" cy="158" r="4" fill-opacity="0.78"/>
    <circle cx="1560" cy="252" r="2.8" fill-opacity="0.5"/>
  </g>

  <!-- ===== 6. 电路走线（左下 / 右上角） ===== -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="square">
    <path d="M60 786 H214 V700 H356 V742 H470" stroke-opacity="0.32"/>
    <path d="M60 846 H164 V792 H300" stroke-opacity="0.22"/>
    <path d="M1540 214 H1418 V300 H1306 V268 H1214" stroke-opacity="0.28"/>
    <path d="M1540 156 H1470 V104 H1372" stroke-opacity="0.2"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="214" cy="786" r="3.6" fill-opacity="0.85"/>
    <circle cx="356" cy="700" r="2.8" fill-opacity="0.6"/>
    <circle cx="164" cy="846" r="3" fill-opacity="0.65"/>
    <circle cx="1418" cy="214" r="3.4" fill-opacity="0.8"/>
    <circle cx="1306" cy="300" r="2.8" fill-opacity="0.6"/>
    <circle cx="1470" cy="156" r="3" fill-opacity="0.7"/>
  </g>

  <!-- ===== 7. 悬浮粒子 ===== -->
  <g fill="#e0f2fe">
    <circle cx="352" cy="128" r="1.7" fill-opacity="0.5"/>
    <circle cx="604" cy="86" r="1.4" fill-opacity="0.38"/>
    <circle cx="742" cy="150" r="1.9" fill-opacity="0.45"/>
    <circle cx="980" cy="104" r="1.5" fill-opacity="0.4"/>
    <circle cx="1160" cy="176" r="1.7" fill-opacity="0.45"/>
    <circle cx="1348" cy="92" r="1.4" fill-opacity="0.35"/>
    <circle cx="150" cy="452" r="1.6" fill-opacity="0.4"/>
    <circle cx="64" cy="248" r="1.5" fill-opacity="0.38"/>
    <circle cx="486" cy="404" r="1.4" fill-opacity="0.3"/>
    <circle cx="1132" cy="392" r="1.5" fill-opacity="0.32"/>
    <circle cx="1540" cy="430" r="1.6" fill-opacity="0.4"/>
    <circle cx="212" cy="600" r="1.5" fill-opacity="0.38"/>
    <circle cx="430" cy="742" r="1.7" fill-opacity="0.44"/>
    <circle cx="640" cy="820" r="1.4" fill-opacity="0.34"/>
    <circle cx="860" cy="790" r="1.8" fill-opacity="0.42"/>
    <circle cx="1046" cy="836" r="1.5" fill-opacity="0.36"/>
    <circle cx="1236" cy="756" r="1.6" fill-opacity="0.4"/>
    <circle cx="1452" cy="856" r="1.4" fill-opacity="0.34"/>
    <circle cx="1122" cy="252" r="1.4" fill-opacity="0.3"/>
    <circle cx="836" cy="64" r="1.5" fill-opacity="0.35"/>
    <circle cx="336" cy="560" r="1.3" fill-opacity="0.26"/>
    <circle cx="1288" cy="486" r="1.3" fill-opacity="0.26"/>
  </g>

  <!-- ===== 8. 角落淡雅代码符号（开发者气质） ===== -->
  <g fill="#7dd3fc" fill-opacity="0.075" font-family="Consolas, 'Courier New', monospace" font-weight="700">
    <text x="92" y="152" font-size="132">&lt;/&gt;</text>
    <text x="1360" y="838" font-size="118">{ }</text>
    <text x="1420" y="128" font-size="96">$</text>
    <text x="120" y="804" font-size="104">#</text>
  </g>

  <!-- ===== 8.5 雷达式同心圆环（中心区域也有纹理，窄屏裁切后仍可见） ===== -->
  <g fill="none" stroke="#7dd3fc">
    <circle cx="800" cy="420" r="230" stroke-width="1.2" stroke-opacity="0.11"/>
    <circle cx="800" cy="420" r="340" stroke-width="1" stroke-opacity="0.075"/>
    <circle cx="800" cy="420" r="470" stroke-width="1" stroke-opacity="0.055"/>
    <circle cx="800" cy="420" r="620" stroke-width="1" stroke-opacity="0.04"/>
    <circle cx="800" cy="420" r="290" stroke-width="1" stroke-opacity="0.09"
            stroke-dasharray="5 15"/>
    <!-- 两段高亮弧，模拟 HUD 扫描环 -->
    <path d="M1158 253.1A395 395 0 0 1 1158 586.9" stroke="#22d3ee" stroke-width="1.8"
          stroke-opacity="0.16" stroke-linecap="round"/>
    <path d="M428.8 555.1A395 395 0 0 1 442.1 253.1" stroke="#22d3ee" stroke-width="1.5"
          stroke-opacity="0.12" stroke-linecap="round"/>
  </g>

  <!-- ===== 9. 暗角收边 ===== -->
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- ===== 10. 底部渐隐，衔接下方正文 ===== -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#bottomFade)"/>
</svg>
