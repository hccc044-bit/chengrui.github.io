<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RHCSA 学习地图 · Rui Cheng</title>
<style>
:root{
  --bg:#ffffff; --panel:#f6f7f9; --panel2:#eceff2; --bd:#e1e4e8;
  --tx:#1f2328; --tx2:#57606a; --tx3:#8b949e;
  --ok:#1a7f37; --okbg:#e9f6ee; --okbd:#b7e0c4;
  --doing:#9a6700; --doingbg:#fff6dd; --doingbd:#e8d18a;
  --todo:#57606a; --todobg:#eef1f4; --todobd:#d8dee4;
  --code:#f2f4f7; --accent:#2f6f4f; --warn:#b42318; --warnbg:#fdeceb;
}
html[data-theme="dark"]{
  --bg:#14171a; --panel:#1b1f23; --panel2:#22272b; --bd:#30363d;
  --tx:#e6edf3; --tx2:#9aa4ae; --tx3:#6e7681;
  --ok:#3fb950; --okbg:#16281c; --okbd:#2c4a36;
  --doing:#d29922; --doingbg:#2a2314; --doingbd:#4a3d18;
  --todo:#8b949e; --todobg:#22272b; --todobd:#30363d;
  --code:#1b1f23; --accent:#5bbd8e; --warn:#f85149; --warnbg:#2d1618;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

header{padding:28px 24px 20px;border-bottom:1px solid var(--bd)}
.hd{max-width:1280px;margin:0 auto}
h1{margin:0;font-size:23px;font-weight:600;letter-spacing:-.2px}
.sub{margin:6px 0 0;color:var(--tx2);font-size:13.5px}
.hdbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  font-size:12.5px;border:1px solid var(--bd);background:var(--panel);color:var(--tx2);white-space:nowrap}
.pill b{color:var(--tx);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.d-ok{background:var(--ok)} .d-doing{background:var(--doing)} .d-todo{background:var(--todo)}
.spacer{flex:1 1 auto}
input[type=search]{padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);
  color:var(--tx);font-size:13.5px;min-width:190px;outline:none;font-family:inherit}
input[type=search]:focus{border-color:var(--accent)}
button{font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--bd);border-radius:8px;
  background:var(--panel);color:var(--tx2);cursor:pointer}
button:hover{border-color:var(--tx3);color:var(--tx)}

.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:264px minmax(0,1fr);gap:28px;padding:24px}

aside{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;
  border:1px solid var(--bd);border-radius:12px;background:var(--panel);padding:14px}
aside h2{margin:0 0 10px;font-size:12.5px;color:var(--tx3);font-weight:600;letter-spacing:.4px}
.tnode{margin-bottom:2px}
.tchap{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;
  font-size:13.5px;font-weight:500;color:var(--tx)}
.tchap:hover{background:var(--panel2)}
.tkids{margin:0 0 6px 20px;border-left:1px solid var(--bd);padding-left:8px}
.tkid{display:block;padding:4px 8px;border-radius:6px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.tkid:hover{background:var(--panel2);color:var(--tx)}

main{min-width:0}
.chap{border:1px solid var(--bd);border-radius:12px;margin-bottom:22px;overflow:hidden;background:var(--bg)}
.chap-hd{display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(--panel);cursor:pointer;
  border-bottom:1px solid var(--bd)}
.chap-hd h3{margin:0;font-size:16.5px;font-weight:600;flex:1 1 auto}
.chap-num{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.chap-bd{padding:4px 18px 18px}
.chap.collapsed .chap-bd{display:none}
.chap-note{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--panel);
  color:var(--tx2);font-size:13px;border:1px solid var(--bd)}

.tag{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap;font-weight:500}
.tag.ok{color:var(--ok);background:var(--okbg);border-color:var(--okbd)}
.tag.doing{color:var(--doing);background:var(--doingbg);border-color:var(--doingbd)}
.tag.todo{color:var(--todo);background:var(--todobg);border-color:var(--todobd)}

.node{border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-top:14px;background:var(--bg)}
.node h4{margin:0 0 10px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.node h4::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);flex:0 0 auto}
.node p{margin:0 0 9px;font-size:13.8px;color:var(--tx)}
.node ul{margin:0 0 9px;padding-left:20px}
.node li{font-size:13.8px;margin-bottom:5px}
.node li::marker{color:var(--tx3)}

.cmds{margin:10px 0 0;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.cmd{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-bottom:1px solid var(--bd)}
.cmd:last-child{border-bottom:none}
.cmd code{display:block;padding:8px 12px;background:var(--code);font-size:12.8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--tx);
  white-space:pre-wrap;word-break:break-word;border-right:1px solid var(--bd);line-height:1.55}
.cmd span{padding:8px 12px;font-size:12.8px;color:var(--tx2);line-height:1.6}

.keys{margin:10px 0 0}
.key{position:relative;padding:8px 12px 8px 30px;border-radius:8px;background:var(--warnbg);
  color:var(--warn);font-size:13.2px;margin-bottom:6px;border:1px solid transparent;line-height:1.62}
.key::before{content:"!";position:absolute;left:11px;top:8px;font-weight:700}
.key.mem{background:var(--panel);color:var(--tx2);border-color:var(--bd)}
.key.mem::before{content:"→";color:var(--accent);font-weight:600}

details.quiz{margin-top:12px;border:1px solid var(--doingbd);border-radius:9px;overflow:hidden;background:var(--doingbg)}
details.quiz>summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--doing);
  list-style:none;display:flex;gap:9px;align-items:flex-start}
details.quiz>summary::-webkit-details-marker{display:none}
details.quiz>summary::before{content:"题";flex:0 0 auto;width:19px;height:19px;border-radius:5px;
  background:var(--doing);color:var(--bg);font-size:11.5px;font-weight:700;display:flex;
  align-items:center;justify-content:center;margin-top:2px}
.qbd{padding:0 14px 14px 42px;font-size:13.3px;color:var(--tx)}
.qbd .lbl{font-size:12px;color:var(--tx3);margin:8px 0 4px}
.qbd pre{margin:6px 0;padding:9px 11px;background:var(--code);border-radius:7px;overflow:auto;
  font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.55}
.qbd ul{padding-left:19px;margin:6px 0}
.qbd li{margin-bottom:4px}
.qbd .ok{color:var(--ok);font-weight:500}
.qbd .no{color:var(--warn);font-weight:500}

.tblwrap{overflow-x:auto;margin:10px 0 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--panel);font-weight:600;color:var(--tx2);font-size:12.5px}
td code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
  background:var(--code);padding:1px 5px;border-radius:4px}

footer{max-width:1280px;margin:0 auto;padding:8px 24px 40px;color:var(--tx3);font-size:12.5px}
.hidden{display:none !important}
.hl{background:var(--doingbg);border-radius:3px;padding:0 2px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px;gap:16px}
  aside{position:static;max-height:none}
  .cmd{grid-template-columns:1fr}
  .cmd code{border-right:none;border-bottom:1px solid var(--bd)}
  header{padding:20px 16px 16px}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>RHCSA 学习地图</h1>
    <p class="sub">按能力域组织的知识树 · 每节含知识点、命令释义、内联练习题（答案可折叠）· 已完成部分带标记</p>
    <div class="hdbar">
      <div class="stat" id="stat"></div>
      <span class="spacer"></span>
      <input type="search" id="q" placeholder="搜索知识点 / 命令…">
      <button id="expandAll">展开全部答案</button>
      <button id="toggleTheme">切换主题</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside id="tree"></aside>
  <main id="content"></main>
</div>

<footer>
  <p>说明：本页是学习过程中的个人笔记，命令与结论都经过实验机实测；空白章节为尚未展开的能力域。</p>
</footer>

<script>
const ST = {
  ok:   {name: '已完成', cls: 'ok',   dot: 'd-ok'},
  doing:{name: '进行中', cls: 'doing', dot: 'd-doing'},
  todo: {name: '未开始', cls: 'todo',  dot: 'd-todo'}
};

const MAP = [
{
  id: 'env', name: '一、环境底座', status: 'ok',
  note: '实验环境的初始化。这一层不先做通，后面的题全都做不了 —— 没有可用软件源就装不了包，网络不通就取不到证据。',
  nodes: [
    {
      t: '虚拟机网络的三方角色（NAT 模式）',
      p: ['虚拟机用 NAT 模式时，实际有<b>三个</b>东西要分清，改网段时必须两侧同时改，缺一侧就断网。'],
      c: [
        ['VMnet8 虚拟网卡（宿主机侧）', '宿主机上的虚拟网卡，通常占网段第一个地址，如 192.168.30.1'],
        ['NAT 网关', 'VMware 的 NAT 服务，通常占第二个地址，如 192.168.30.2 —— ★ 虚拟机的网关要填这个'],
        ['DHCP 池', '默认从 .128 开始分配，静态 IP 要避开这个区间']
      ],
      k: ['★ 最容易错的一格：把网关填成 .1（填成了宿主机网卡地址）。.1 是宿主机自己，不是出口。',
          '改网段要同时改 VMware 虚拟网络编辑器（vmnetcfg）和虚拟机内部配置，只改一侧必断。']
    },
    {
      t: '用 nmcli 配静态 IP',
      c: [
        ['nmcli con show', '列出所有网络连接（connection）的名字，改配置要用这个名字'],
        ['nmcli con mod "System eth0" ipv4.addresses 192.168.30.22/24', '设置静态地址与掩码位数'],
        ['nmcli con mod "System eth0" ipv4.gateway 192.168.30.2', '设置默认网关'],
        ['nmcli con mod "System eth0" ipv4.dns "223.5.5.5"', '设置 DNS 服务器'],
        ['nmcli con mod "System eth0" ipv4.method manual', '★ 必须改成 manual，否则继续走 DHCP，手填的地址不生效'],
        ['nmcli con up "System eth0"', '让改动作在运行中生效'],
        ['ip a / ip r', '验证：看地址有没有、默认路由指向对不对']
      ],
      k: ['→ 四条 ipv4.* 必须一次配全，最后别忘 ipv4.method manual。']
    },
    {
      t: '网络不通的分层排查顺序',
      p: ['排查的本质是「先把范围缩小，再定位」。不要一上来就猜，按下面顺序拆：'],
      c: [
        ['ip a', '本机有没有拿到正确地址（第 3 层）'],
        ['ip r', '默认路由指向哪个网关'],
        ['ping 网关', '通不通 → 判断是「本段内」还是「出网」的问题'],
        ['ping 223.5.5.5（纯 IP）', '通 → 链路与外网没问题，问题在域名解析'],
        ['ping baidu.com（域名）', '不通 → 查 /etc/resolv.conf 里的 DNS'],
        ['cat /etc/resolv.conf', '看实际生效的 DNS']
      ],
      k: ['★ 判读口诀：本机能通、虚拟机能通宿主机、但通不出网关 → 先怀疑网关地址填错。',
          '★ 拆方向：把我 ping 你 和 你 ping 我 分开测，单向不通通常是防火墙，双向不通通常是链路或地址。']
    },
    {
      t: 'dnf / yum 换源',
      p: ['默认源在国内下载很慢，换成镜像站后速度可以从 113 KB/s 提到 20 MB/s 以上。'],
      c: [
        ['ls /etc/yum.repos.d/', '★ 先看本机真实的文件名 —— 照抄别处的文件名会漏改（Rocky 9 是 rocky.repo，不是 Rocky-BaseOS.repo）'],
        ['cp -a /etc/yum.repos.d /etc/yum.repos.d.bak', '改之前先备份原始配置'],
        ['dnf repolist', '列出已启用的仓库'],
        ['dnf repolist -v', '看每个仓库的真实 URL（这一条会联网）'],
        ['dnf makecache', '真正下载元数据 —— 只有走到这一步才算验证通过'],
        ['dnf clean all && dnf makecache', '清掉旧缓存再重建，换源后建议做一次']
      ],
      k: ['★ $releasever 在 Rocky 9 上解析为 9（不是 9.7）。用包版本去猜它会写成不可用的地址。',
          '★ repo 文件里 baseurl 才是关键；mirrorlist 需要注释掉，否则它会盖过 baseurl。']
    },
    {
      t: '仓库配置的字段格式',
      c: [
        ['[BaseOS]', '仓库 ID（方括号里的名字），随便起但要唯一'],
        ['name=BaseOS', '仓库描述，人类看的，不影响功能'],
        ['baseurl=https://mirrors.aliyun.com/rockylinux/$releasever/BaseOS/$basearch/os/', '实际下载地址，支持两个变量：$releasever 和 $basearch'],
        ['gpgcheck=0', '是否校验包签名。练习环境图省事关掉；生产环境应保持 1'],
        ['enabled=1', '是否启用这个仓库（0 = 停用）']
      ],
      k: ['★ 一个 repo 文件里可以写多个 [节]，每个节是一个独立仓库。']
    },
    {
      t: 'SELinux',
      p: ['红帽系发行版的内核级强制访问控制。考试必考，练习环境必须保持 Enforcing。'],
      c: [
        ['getenforce', '看当前模式：Enforcing / Permissive / Disabled'],
        ['setenforce 0', '临时切到宽容模式（重启失效）—— 排查时可以用，改完记得 setenforce 1'],
        ['vim /etc/selinux/config', '永久修改；SELINUX=enforcing 是推荐值'],
        ['ls -Z /path', '看文件的安全上下文（如 httpd_sys_content_t）'],
        ['semanage fcontext -a -t httpd_sys_content_t "/web(/.*)?"', '给一个路径模式登记上下文规则'],
        ['restorecon -Rv /web', '按规则把上下文实际刷上去'],
        ['ausearch -m AVC -ts recent', '查被 SELinux 拦下来的记录（审计日志）']
      ],
      k: ['★ 永久改成 Disabled 之后再想恢复，必须 touch /.autorelabel 并重启，让全盘重新打标签 —— 非常费时。所以别关。',
          '★ 判断拦路的是不是 SELinux：临时 setenforce 0 再试。变好了就是它，改完记得切回去。']
    },
    {
      t: 'firewalld',
      c: [
        ['systemctl is-active firewalld', '服务是否在跑'],
        ['firewall-cmd --state', '同上的简写'],
        ['firewall-cmd --list-all', '看当前区域（zone）放行了什么服务、端口'],
        ['firewall-cmd --add-service=http', '临时放行 http（立即生效，重启丢）'],
        ['firewall-cmd --add-service=http --permanent', '永久放行（不立即生效）'],
        ['firewall-cmd --reload', '把 permanent 规则加载进运行时'],
        ['firewall-cmd --add-port=8080/tcp --permanent', '放行自定义端口']
      ],
      k: ['★ 临时规则和永久规则是两套，要两个都做（或加 --permanent 后 reload）才算配好。',
          '★ 排查时的顺序：先看服务在不在跑 → 再看 zone 放行了什么 → 最后才怀疑上游。']
    },
    {
      t: '快照工作流',
      p: ['RHCSA 是单机考试，练习时只需一台机器。用「初始化一次 + 打快照 + 练坏就回滚」代替反复重装。'],
      k: ['★ 动手改分区表、改 fstab、动网络配置之前，先拍一张快照 —— 这些操作错了会让整机起不来，SSH 都进不去，只能在控制台救。',
          '→ fstab 写错的表现：系统进入 emergency mode，所有非根挂载失败。']
    }
  ],
  quiz: [
    {
      q: '配置仓库后，怎么确认它真的能用？（提示：说清每一步验证的是哪一层）',
      a: [
        '<div class="lbl">三层阶梯 —— 必须走到能下载那一层</div>',
        '<pre>dnf repolist          # 第 1 层：不联网，只读配置。baseurl 写成 404 也报成功</pre>',
        '<pre>dnf repolist -v       # 第 2 层：联网，会去下载元数据。地址不对这里会报错</pre>',
        '<pre>dnf makecache         # 第 3 层：真正把元数据落到本地缓存。这才是「做到了」</pre>',
        '<div class="lbl">为什么要分三层</div>',
        '<p>因为 <code>dnf repolist</code> 只验「配置语法读通了」，不验「地址可达」。这是典型的<span class="no">验收命令会骗人</span>。</p>'
      ]
    },
    {
      q: '虚拟机能 ping 通宿主机和网关，但 ping 不通 8.8.8.8，也 ping 不通 baidu.com。你会按什么顺序排查？',
      a: [
        '<ul>',
        '<li><code>ip r</code> 先确认默认路由指向的网关地址 —— <b>最常见的原因就是网关填成了 .1</b>（宿主机网卡地址），而不是 NAT 网关 .2</li>',
        '<li>确认对了之后 <code>cat /etc/resolv.conf</code>，看 DNS 有没有配</li>',
        '<li>用 <code>ping 223.5.5.5</code> 区分「网络不通」和「域名解析不通」：<b>能 ping 通 IP 但 ping 不通域名 = 纯 DNS 问题</b></li>',
        '</ul>',
        '<div class="lbl">结论</div>',
        '<p>分层的意义是：每一层只回答一个问题，能让范围立刻减半。</p>'
      ]
    }
  ]
},
{
  id: 'user', name: '二、用户与组', status: 'ok',
  note: 'EX200 里分值最密集的一块（题库 6 道）。核心不是记命令，而是知道 useradd 到底往哪几个文件里写了什么。',
  nodes: [
    {
      t: '账号信息落在六个文件里',
      c: [
        ['/etc/passwd', '账号主表：用户名:口令占位:UID:GID:说明:家目录:登录shell。所有用户都可读'],
        ['/etc/shadow', '口令与有效期：只有 root 可读。字段 2 存放加密后的口令'],
        ['/etc/group', '组表：组名:口令占位:GID:成员列表（附加组成员）'],
        ['/etc/gshadow', '组口令与组管理员，基本不用'],
        ['/etc/subuid', '给每个用户划的从属 UID 段（rootless 容器用）'],
        ['/etc/subgid', '同上，从属 GID 段']
      ],
      k: ['★ 判定「一件事到底改了什么」，最可靠的方法是动手前后各拷一份然后 diff —— 比看文档准。',
          '→ cp -a /etc/{passwd,shadow,group,gshadow,subuid,subgid} /tmp/before/ ，操作后再 diff。']
    },
    {
      t: '/etc/passwd 的 7 个字段',

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderTree() {
  const t = document.getElementById('tree');
  let html = '<h2>目录</h2>';
  MAP.forEach(ch => {
    html += '<div class="tnode">';
    html += '<div class="tchap" data-go="chap-' + ch.id + '">' +
            '<span class="dot ' + ST[ch.status].dot + '"></span>' + esc(ch.name) + '</div>';
    html += '<div class="tkids">';
    ch.nodes.forEach((n, i) => {
      html += '<span class="tkid" data-go="node-' + ch.id + '-' + i + '">' + esc(n.t) + '</span>';
    });
    if (ch.quiz && ch.quiz.length) {
      html += '<span class="tkid" data-go="quiz-' + ch.id + '">练习题 ' + ch.quiz.length + ' 道</span>';
    }
    html += '</div></div>';
  });
  t.innerHTML = html;
}

function renderContent() {
  const c = document.getElementById('content');
  let html = '';
  MAP.forEach(ch => {
    html += '<section class="chap" id="chap-' + ch.id + '">';
    html += '<div class="chap-hd"><span class="chap-num">' + esc(ch.id) + '</span><h3>' + esc(ch.name) +
            '</h3><span class="tag ' + ST[ch.status].cls + '">' + ST[ch.status].name + '</span></div>';
    html += '<div class="chap-bd">';
    if (ch.note) html += '<p class="chap-note">' + ch.note + '</p>';

    ch.nodes.forEach((n, i) => {
      html += '<div class="node" id="node-' + ch.id + '-' + i + '">';
      html += '<h4>' + esc(n.t) + '</h4>';
      (n.p || []).forEach(p => { html += '<p>' + p + '</p>'; });
      if (n.ul) { html += '<ul>'; n.ul.forEach(x => { html += '<li>' + x + '</li>'; }); html += '</ul>'; }
      if (n.c) {
        html += '<div class="cmds">';
        n.c.forEach(([cmd, desc]) => {
          html += '<div class="cmd"><code>' + esc(cmd) + '</code><span>' + desc + '</span></div>';
        });
        html += '</div>';
      }
      if (n.k) {
        html += '<div class="keys">';
        n.k.forEach(x => {
          const mem = x.indexOf('→') === 0;
          html += '<div class="key' + (mem ? ' mem' : '') + '">' + x + '</div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });

    if (ch.quiz && ch.quiz.length) {
      html += '<div id="quiz-' + ch.id + '">';
      ch.quiz.forEach((q, i) => {
        html += '<details class="quiz"><summary>' + esc(q.q) + '</summary><div class="qbd">';
        q.a.forEach(x => {
          if (x.indexOf('<') === 0) html += x;
          else html += '<p>' + x + '</p>';
        });
        html += '</div></details>';
      });
      html += '</div>';
    }
    html += '</div></section>';
  });
  c.innerHTML = html;
}

function renderStat() {
  const cnt = {ok: 0, doing: 0, todo: 0};
  MAP.forEach(ch => { cnt[ch.status]++; });
  let qn = 0; MAP.forEach(ch => { qn += (ch.quiz ? ch.quiz.length : 0); });
  let nn = 0; MAP.forEach(ch => { nn += ch.nodes.length; });
  document.getElementById('stat').innerHTML =
    '<span class="pill"><span class="dot d-ok"></span>已完成 <b>' + cnt.ok + '</b></span>' +
    '<span class="pill"><span class="dot d-doing"></span>进行中 <b>' + cnt.doing + '</b></span>' +
    '<span class="pill"><span class="dot d-todo"></span>未开始 <b>' + cnt.todo + '</b></span>' +
    '<span class="pill">知识节点 <b>' + nn + '</b></span>' +
    '<span class="pill">练习题 <b>' + qn + '</b></span>';
}

function bindTree() {
  document.getElementById('tree').addEventListener('click', e => {
    const el = e.target.closest('[data-go]');
    if (!el) return;
    const target = document.getElementById(el.getAttribute('data-go'));
    if (!target) return;
    const chap = target.closest('.chap');
    if (chap) chap.classList.remove('collapsed');
    window.scrollTo({top: target.getBoundingClientRect().top + window.pageYOffset - 12, behavior: 'smooth'});
  });
}

function bindCollapse() {
  document.querySelectorAll('.chap-hd').forEach(hd => {
    hd.addEventListener('click', () => { hd.parentElement.classList.toggle('collapsed'); });
  });
}

function bindSearch() {
  const box = document.getElementById('q');
  box.addEventListener('input', () => {
    const kw = box.value.trim().toLowerCase();
    MAP.forEach(ch => {
      let shown = 0;
      ch.nodes.forEach((n, i) => {
        const el = document.getElementById('node-' + ch.id + '-' + i);
        if (!el) return;
        const hay = (n.t + ' ' + (n.p || []).join(' ') + ' ' + (n.ul || []).join(' ') + ' ' +
                     (n.c || []).map(x => x.join(' ')).join(' ') + ' ' + (n.k || []).join(' ')).toLowerCase();
        const hit = !kw || hay.indexOf(kw) !== -1;
        el.classList.toggle('hidden', !hit);
        if (hit) shown++;
      });
      const sec = document.getElementById('chap-' + ch.id);
      if (sec) sec.classList.toggle('hidden', kw && shown === 0);
    });
  });
}

function bindButtons() {
  document.getElementById('expandAll').addEventListener('click', e => {
    const all = document.querySelectorAll('details.quiz');
    let anyClosed = false;
    all.forEach(d => { if (!d.open) anyClosed = true; });
    all.forEach(d => { d.open = anyClosed; });
    e.target.textContent = anyClosed ? '收起全部答案' : '展开全部答案';
  });

  const btn = document.getElementById('toggleTheme');
  const apply = mode => {
    document.documentElement.setAttribute('data-theme', mode);
    btn.textContent = mode === 'dark' ? '浅色主题' : '深色主题';
  };
  let saved = null;
  try { saved = localStorage.getItem('rhcsa-map-theme'); } catch (err) {}
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  apply(saved || (prefersDark ? 'dark' : 'light'));
  btn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(next);
    try { localStorage.setItem('rhcsa-map-theme', next); } catch (err) {}
  });
}

renderTree();
renderContent();
renderStat();
bindTree();
bindCollapse();
bindSearch();
bindButtons();
</script>
